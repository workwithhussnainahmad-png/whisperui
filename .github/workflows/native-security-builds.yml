name: Native security builds

# Compile the native bridges in clean generated projects. These jobs do not
# publish apps, use production credentials, or replace physical-device tests.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npx expo prebuild --platform android --clean --no-install
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: pod install
        working-directory: ios
      - run: xcodebuild -workspace ios/Whisper.xcworkspace -scheme Whisper -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
