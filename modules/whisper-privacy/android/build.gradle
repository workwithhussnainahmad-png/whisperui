plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.whisper.privacy'
version = '1.0.0'
repositories {
  maven { url 'https://build-artifacts.signal.org/libraries/maven/'; content { includeGroup 'org.signal' } }
}
dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  implementation 'org.signal:libsignal-client:0.105.1'
  implementation 'org.signal:libsignal-android:0.105.1'
  // Must match the Media3 version bundled by expo-video.
  implementation 'androidx.media3:media3-transformer:1.9.0'
  implementation 'androidx.media3:media3-effect:1.9.0'
  implementation 'androidx.media3:media3-common:1.9.0'
}
android {
  namespace 'com.whisper.privacy'
  defaultConfig { versionCode 1; versionName '1.0.0' }
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  packaging { resources { excludes += ['**/*.dll', '**/*.dylib'] } }
}
